name: Madeira iOS 16.5 build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: madeira-ios16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-vcruntime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Restore Microsoft VC++ runtime cache
        id: cache-vcruntime
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/x86_64-vcruntime
          key: madeira-vcruntime-x64-v1

      - name: Download and install official Microsoft VC++ x64 runtime
        if: steps.cache-vcruntime.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "vc_redist.x64.exe"
          Invoke-WebRequest "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList "/install","/quiet","/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 1638 -and $p.ExitCode -ne 3010) {
            throw "VC_redist failed with exit code $($p.ExitCode)"
          }

          $dest = Join-Path $env:RUNNER_TEMP "x86_64-vcruntime"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $required = @(
            "concrt140.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "vcamp140.dll",
            "vccorlib140.dll",
            "vcomp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "vcruntime140_threads.dll"
          )

          $vsRoot = Join-Path $env:ProgramFiles "Microsoft Visual Studio"
          foreach ($dll in $required) {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (-not (Test-Path $src)) {
              $candidate = Get-ChildItem -Path $vsRoot -Recurse -File -Filter $dll -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Select-Object -First 1
              if ($null -eq $candidate) {
                throw "Required runtime DLL not found after official install: $dll"
              }
              $src = $candidate.FullName
            }
            Copy-Item $src (Join-Path $dest $dll)
          }

          Get-ChildItem $dest | Format-Table Name,Length
          if ((Get-ChildItem $dest -Filter *.dll).Count -ne 12) {
            throw "Expected exactly 12 runtime DLLs"
          }

      - name: Save Microsoft VC++ runtime cache
        if: steps.cache-vcruntime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/x86_64-vcruntime
          key: madeira-vcruntime-x64-v1

      - name: Upload VC++ runtime
        uses: actions/upload-artifact@v4
        with:
          name: madeira-vcruntime-x64
          path: ${{ runner.temp }}/x86_64-vcruntime
          if-no-files-found: error

  build:
    needs: prepare-vcruntime
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout with nested submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Compute dependency cache keys
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          echo "wine=$(git -C wine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fex=$(git -C FEX rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dxmt=$(git -C research/dxmt rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download Microsoft VC++ runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: madeira-vcruntime-x64
          path: app/Madeira/x86_64-vcruntime

      - name: Verify Microsoft VC++ runtime artifact
        run: |
          set -euxo pipefail
          ls -lh app/Madeira/x86_64-vcruntime
          test "$(find app/Madeira/x86_64-vcruntime -type f -name '*.dll' | wc -l | tr -d ' ')" -eq 12

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: Check build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          python3 -m pip install --user --break-system-packages packaging
          python3 -c 'import packaging; print("packaging", packaging.__version__)'
          cmake --version
          ninja --version

      - name: Verify iOS 16.5 source targets
        run: |
          set -euxo pipefail
          ! grep -RInE 'IPHONEOS_DEPLOYMENT_TARGET = (17|18)\.|miphoneos-version-min=(17|18)\.|CMAKE_OSX_DEPLOYMENT_TARGET=(17|18)\.|"minOSVersion": "(17|18)\.' \
            app build

      - name: Restore Wine metadata cache
        id: cache-wine
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            wine/build-macos
          key: madeira-wine-ios16.5-xcode26.6-v1-${{ steps.deps.outputs.wine }}

      - name: Configure Wine build metadata
        if: steps.cache-wine.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          brew list bison >/dev/null 2>&1 || brew install bison
          export PATH="/opt/homebrew/opt/bison/bin:$PATH"
          bison --version | head -1

          MINGW_DIR="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal"
          if [ ! -x "$MINGW_DIR/bin/aarch64-w64-mingw32-clang" ]; then
            mkdir -p "$GITHUB_WORKSPACE/toolchains"
            curl -fL --retry 3 \
              https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz \
              | tar -xJ -C "$GITHUB_WORKSPACE/toolchains"
          fi
          export PATH="$MINGW_DIR/bin:$PATH"
          aarch64-w64-mingw32-clang --version | head -1

          rm -rf wine/build-macos
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure \
            --enable-win64 \
            --without-x \
            --without-freetype \
            --without-fontconfig \
            --without-gnutls \
            --without-pulse \
            --without-alsa
          test -f include/config.h
          echo "Wine configure generated $(find include -type f | wc -l | tr -d ' ') include files"

      - name: Generate Wine IDL headers
        run: |
          set -euxo pipefail
          brew list bison >/dev/null 2>&1 || brew install bison
          export PATH="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:/opt/homebrew/opt/bison/bin:$PATH"
          bison --version | head -1
          make -C wine/build-macos -j3 \
            include/wtypesbase.h \
            include/wtypes.h \
            include/unknwn.h \
            include/objidlbase.h \
            include/objidl.h \
            include/oaidl.h \
            include/propidl.h \
            include/oleidl.h \
            include/ocidl.h \
            include/servprov.h \
            include/msxml.h \
            include/urlmon.h \
            include/dxgiformat.h \
            include/dxgicommon.h \
            include/dxgitype.h \
            include/dxgi.h \
            include/d3dcommon.h \
            include/d3d10.h \
            include/d3d10sdklayers.h \
            include/d3d10_1.h \
            include/dcommon.h \
            include/d2d1.h \
            include/dwrite.h \
            include/dwrite_1.h \
            include/dwrite_2.h \
            include/dwrite_3.h
          for h in wtypesbase.h wtypes.h unknwn.h objidlbase.h objidl.h oaidl.h propidl.h oleidl.h ocidl.h servprov.h msxml.h urlmon.h dxgiformat.h dxgicommon.h dxgitype.h dxgi.h d3dcommon.h d3d10.h d3d10sdklayers.h d3d10_1.h dcommon.h d2d1.h dwrite.h dwrite_1.h dwrite_2.h dwrite_3.h; do
            test -f "wine/build-macos/include/$h"
          done

      - name: Save Wine metadata cache
        if: steps.cache-wine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            wine/build-macos
          key: madeira-wine-ios16.5-xcode26.6-v1-${{ steps.deps.outputs.wine }}

      - name: Restore GnuTLS iOS cache
        id: cache-gnutls
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/gnutls-ios
            app/Madeira/libgnutls.a
            app/Madeira/libhogweed.a
            app/Madeira/libnettle.a
            app/Madeira/libgmp.a
          key: madeira-gnutls-ios16.5-v2-${{ hashFiles('build/gnutls-ios/build.sh', 'build/gnutls-ios/src/SHA256SUMS') }}
          restore-keys: |
            madeira-gnutls-ios16.5-v1-

      - name: Build GnuTLS stack for iOS 16.5
        if: steps.cache-gnutls.outputs.cache-matched-key == ''
        run: |
          set -euxo pipefail
          rm -rf build/gnutls-ios/obj toolchains/gnutls-ios
          bash build/gnutls-ios/build.sh
          cp toolchains/gnutls-ios/lib/libgnutls.a app/Madeira/libgnutls.a
          cp toolchains/gnutls-ios/lib/libhogweed.a app/Madeira/libhogweed.a
          cp toolchains/gnutls-ios/lib/libnettle.a app/Madeira/libnettle.a
          cp toolchains/gnutls-ios/lib/libgmp.a app/Madeira/libgmp.a

      - name: Save GnuTLS iOS cache
        if: steps.cache-gnutls.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/gnutls-ios
            app/Madeira/libgnutls.a
            app/Madeira/libhogweed.a
            app/Madeira/libnettle.a
            app/Madeira/libgmp.a
          key: madeira-gnutls-ios16.5-v2-${{ hashFiles('build/gnutls-ios/build.sh', 'build/gnutls-ios/src/SHA256SUMS') }}

      - name: Restore FreeType iOS cache
        id: cache-freetype
        uses: actions/cache/restore@v4
        with:
          path: |
            research/freetype
            build/freetype-ios/build
          key: madeira-freetype-2.13.3-ios16.5-v2-${{ hashFiles('build/freetype-ios/build.sh') }}
          restore-keys: |
            madeira-freetype-2.13.3-ios16.5-v1-

      - name: Prepare and build FreeType for iOS 16.5
        if: steps.cache-freetype.outputs.cache-matched-key == ''
        run: |
          set -euxo pipefail
          rm -rf research/freetype build/freetype-ios/build
          git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          bash build/freetype-ios/build.sh
          test -f build/freetype-ios/build/libfreetype.a

      - name: Save FreeType iOS cache
        if: steps.cache-freetype.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            research/freetype
            build/freetype-ios/build
          key: madeira-freetype-2.13.3-ios16.5-v2-${{ hashFiles('build/freetype-ios/build.sh') }}

      - name: Patch FEX native-iOS diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("FEX/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp")
          s = p.read_text()
          old = '''  MEMORY_BASIC_INFORMATION mbi {};
            const char* type = "?";
            if (VirtualQuery(reinterpret_cast<LPCVOID>(GPRs[AddressReg]), &mbi, sizeof(mbi))) {
              type = mbi.Type == MEM_IMAGE ? "MEM_IMAGE" : mbi.Type == MEM_MAPPED ? "MEM_MAPPED" : "MEM_PRIVATE";
            }
            LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} "
                              "crosses16B={} | region base={} size={:#x} prot={:#x} type={} state={:#x}",
                              Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15,
                              (GPRs[AddressReg] & 15) ? "yes" : "no", mbi.BaseAddress, mbi.RegionSize,
                              mbi.Protect, type, mbi.State);'''
          new = '''#if defined(_WIN32)
            MEMORY_BASIC_INFORMATION mbi {};
            const char* type = "?";
            if (VirtualQuery(reinterpret_cast<LPCVOID>(GPRs[AddressReg]), &mbi, sizeof(mbi))) {
              type = mbi.Type == MEM_IMAGE ? "MEM_IMAGE" : mbi.Type == MEM_MAPPED ? "MEM_MAPPED" : "MEM_PRIVATE";
            }
            LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} "
                              "crosses16B={} | region base={} size={:#x} prot={:#x} type={} state={:#x}",
                              Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15,
                              (GPRs[AddressReg] & 15) ? "yes" : "no", mbi.BaseAddress, mbi.RegionSize,
                              mbi.Protect, type, mbi.State);
          #else
            LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={} crosses16B={}",
                              Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15,
                              (GPRs[AddressReg] & 15) ? "yes" : "no");
          #endif'''
          if old not in s:
              raise SystemExit("expected Arm64.cpp diagnostic block not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Restore FEX iOS cache
        id: cache-fex
        uses: actions/cache/restore@v4
        with:
          path: FEX/build-ios
          key: madeira-fex-ios16.5-v2-${{ steps.deps.outputs.fex }}

      - name: Configure FEX for iOS 16.5
        if: steps.cache-fex.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf FEX/build-ios
          cmake -S FEX -B FEX/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.5 \
            -DCMAKE_C_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_CXX_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_ASM_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DTUNE_CPU=none \
            -DENABLE_LTO=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DENABLE_ASAN=OFF \
            -DENABLE_TSAN=OFF \
            -DENABLE_UBSAN=OFF

      - name: Build FEX libraries
        if: steps.cache-fex.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          # Madeira links the static FEX libraries. Avoid the unrelated
          # FEXCore_shared target, whose Linux/GNU ld flags are invalid for Apple ld.
          cmake --build FEX/build-ios --target FEXCore FEXCore_Base JemallocLibs --parallel 3
          find FEX/build-ios -name '*.a' -maxdepth 6 -print | sort

      - name: Save FEX iOS cache
        if: steps.cache-fex.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: FEX/build-ios
          key: madeira-fex-ios16.5-v2-${{ steps.deps.outputs.fex }}

      - name: Verify FEX libraries used by Xcode
        run: |
          set -euxo pipefail
          for f in \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a \
            FEX/build-ios/External/fmt/libfmt.a \
            FEX/build-ios/External/cephes/libcephes_128bit.a \
            FEX/build-ios/External/xxhash/cmake_unofficial/libxxhash.a \
            FEX/build-ios/External/SoftFloat-3e/libsoftfloat_3e.a
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Restore wineserver iOS cache
        id: cache-wineserver
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/libwineserver.a
          key: madeira-wineserver-ios16.5-v3-${{ steps.deps.outputs.wine }}-${{ hashFiles('build/wineserver/**/*.sh', 'build/wineserver/**/*.c', 'build/wineserver/**/*.h') }}
          restore-keys: |
            madeira-wineserver-ios16.5-v2-${{ steps.deps.outputs.wine }}-

      - name: Build wineserver for iOS 16.5
        if: steps.cache-wineserver.outputs.cache-matched-key == ''
        run: |
          set -euxo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          if ! command -v llvm-objcopy >/dev/null 2>&1; then
            brew install llvm
            export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          fi
          rm -rf build/wineserver/obj
          bash build/wineserver/build.sh
          test -f app/Madeira/libwineserver.a
          xcrun vtool -show-build app/Madeira/libwineserver.a || true
          ls -lh app/Madeira/libwineserver.a

      - name: Save wineserver iOS cache
        if: steps.cache-wineserver.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/libwineserver.a
          key: madeira-wineserver-ios16.5-v3-${{ steps.deps.outputs.wine }}-${{ hashFiles('build/wineserver/**/*.sh', 'build/wineserver/**/*.c', 'build/wineserver/**/*.h') }}

      - name: Restore ntdll iOS cache
        id: cache-ntdll
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/libntdll_unix.a
          key: madeira-ntdll-ios16.5-v4-${{ steps.deps.outputs.wine }}-${{ hashFiles('build/ntdll-unix/**/*.sh', 'build/ntdll-unix/**/*.c', 'build/ntdll-unix/**/*.h', 'build/crypto-unix/**/*.sh', 'build/crypto-unix/**/*.c', 'build/crypto-unix/**/*.h') }}

      - name: Build ntdll unix side for iOS 16.5
        if: steps.cache-ntdll.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf build/ntdll-unix/obj
          bash build/ntdll-unix/build.sh
          test -f app/Madeira/libntdll_unix.a
          ls -lh app/Madeira/libntdll_unix.a

      - name: Save ntdll iOS cache
        if: steps.cache-ntdll.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/libntdll_unix.a
          key: madeira-ntdll-ios16.5-v4-${{ steps.deps.outputs.wine }}-${{ hashFiles('build/ntdll-unix/**/*.sh', 'build/ntdll-unix/**/*.c', 'build/ntdll-unix/**/*.h', 'build/crypto-unix/**/*.sh', 'build/crypto-unix/**/*.c', 'build/crypto-unix/**/*.h') }}

      - name: Restore win32u iOS cache
        id: cache-win32u
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/libwin32u_unix.a
          key: madeira-win32u-ios16.5-v3-${{ steps.deps.outputs.wine }}-${{ hashFiles('build/win32u-unix/**/*.sh', 'build/win32u-unix/**/*.c', 'build/win32u-unix/**/*.h', 'build/freetype-ios/build.sh') }}

      - name: Build win32u unix side for iOS 16.5
        if: steps.cache-win32u.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf build/win32u-unix/obj
          bash build/win32u-unix/build.sh
          test -f app/Madeira/libwin32u_unix.a
          ls -lh app/Madeira/libwin32u_unix.a

      - name: Save win32u iOS cache
        if: steps.cache-win32u.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/libwin32u_unix.a
          key: madeira-win32u-ios16.5-v3-${{ steps.deps.outputs.wine }}-${{ hashFiles('build/win32u-unix/**/*.sh', 'build/win32u-unix/**/*.c', 'build/win32u-unix/**/*.h', 'build/freetype-ios/build.sh') }}

      - name: Restore LLVM 15 iOS cache
        id: cache-llvm
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib
          key: madeira-llvm15.0.7-ios16.5-xcode26.6-v1

      - name: Build LLVM 15 static libraries for iOS 16.5
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          LLVM_TAG=llvmorg-15.0.7
          LLVM_ROOT="$GITHUB_WORKSPACE/toolchains/llvm-project"
          LLVM_HOST="$GITHUB_WORKSPACE/toolchains/llvm-host-build"
          LLVM_IOS="$GITHUB_WORKSPACE/toolchains/llvm-ios-build"

          if [ ! -d "$LLVM_ROOT/llvm" ]; then
            rm -rf "$LLVM_ROOT"
            mkdir -p "$GITHUB_WORKSPACE/toolchains"
            curl -fL --retry 3 \
              "https://github.com/llvm/llvm-project/archive/refs/tags/$LLVM_TAG.tar.gz" \
              -o "$RUNNER_TEMP/llvm-project.tar.gz"
            tar -xzf "$RUNNER_TEMP/llvm-project.tar.gz" -C "$GITHUB_WORKSPACE/toolchains"
            mv "$GITHUB_WORKSPACE/toolchains/llvm-project-${LLVM_TAG#llvmorg-}" "$LLVM_ROOT"
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path("toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake")
          s = p.read_text()
          old = 'MATCHES "Darwin"'
          count = s.count(old)
          if count:
              s = s.replace(old, 'MATCHES "Darwin|iOS"')
              p.write_text(s)
          print("AddLLVM Darwin->iOS replacements:", count)
          PY

          rm -rf "$LLVM_HOST" "$LLVM_IOS"

          cmake -S "$LLVM_ROOT/llvm" -B "$LLVM_HOST" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF
          cmake --build "$LLVM_HOST" --target llvm-tblgen --parallel 3
          test -x "$LLVM_HOST/bin/llvm-tblgen"

          cmake -S "$LLVM_ROOT/llvm" -B "$LLVM_IOS" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.5 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DLLVM_TABLEGEN="$LLVM_HOST/bin/llvm-tblgen" \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF
          cmake --build "$LLVM_IOS" --parallel 3
          test -d "$LLVM_IOS/lib"
          echo "LLVM iOS static archives: $(find "$LLVM_IOS/lib" -maxdepth 1 -name '*.a' | wc -l | tr -d ' ')"

      - name: Save LLVM 15 iOS cache
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib
          key: madeira-llvm15.0.7-ios16.5-xcode26.6-v1

      - name: Restore DXMT iOS cache
        id: cache-dxmt
        uses: actions/cache/restore@v4
        with:
          path: app/Madeira/libdxmt_combined.a
          key: madeira-dxmt-ios16.5-v3-${{ steps.deps.outputs.dxmt }}-${{ hashFiles('build/dxmt-ios/**/*.sh', 'build/dxmt-ios/**/*.c', 'build/dxmt-ios/**/*.h') }}

      - name: Build DXMT unix side for iOS 16.5
        if: steps.cache-dxmt.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf build/dxmt-ios/obj
          bash build/dxmt-ios/build.sh
          test -f build/dxmt-ios/libdxmt_unix.a

          xcrun -sdk iphoneos libtool -static \
            -o build/dxmt-ios/libdxmt_combined.a \
            build/dxmt-ios/obj/*.o \
            toolchains/llvm-ios-build/lib/*.a

          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/libdxmt_combined.a
          test -f app/Madeira/libdxmt_combined.a
          ls -lh app/Madeira/libdxmt_combined.a

      - name: Save DXMT iOS cache
        if: steps.cache-dxmt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/Madeira/libdxmt_combined.a
          key: madeira-dxmt-ios16.5-v3-${{ steps.deps.outputs.dxmt }}-${{ hashFiles('build/dxmt-ios/**/*.sh', 'build/dxmt-ios/**/*.c', 'build/dxmt-ios/**/*.h') }}

      - name: Inventory remaining native app libraries
        run: |
          set -euxo pipefail
          for f in \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwin32u_unix.a \
            app/Madeira/libdxmt_combined.a \
            app/Madeira/libgnutls.a \
            app/Madeira/libhogweed.a \
            app/Madeira/libnettle.a \
            app/Madeira/libgmp.a
          do
            if [ -f "$f" ]; then
              echo "FOUND $f ($(stat -f%z "$f") bytes)"
            else
              echo "MISSING $f"
            fi
          done

      - name: Attempt unsigned Madeira app build
        run: |
          set -o pipefail
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=16.5 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Package TrollStore IPA
        if: success()
        run: |
          set -euxo pipefail
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/Madeira.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true
          xcrun vtool -show-build "$APP/Madeira" || otool -l "$APP/Madeira"
          codesign --force --deep --sign - \
            --entitlements app/Madeira/Madeira.entitlements "$APP"
          rm -rf Payload Madeira-iOS16.5-TrollStore.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Madeira-iOS16.5-TrollStore.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iOS16.5-TrollStore
          path: Madeira-iOS16.5-TrollStore.ipa
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-ios16-build-logs
          path: |
            xcodebuild.log
            FEX/build-ios/CMakeCache.txt
          if-no-files-found: ignore
