name: Madeira TrollStore JIT regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trollstore-jit:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify TrollStore JIT path has no StikDebug BRK dependency
        run: python3 tools/ci/test_trollstore_jit_path.py
